name: CI-CD Pipeline

on:
  push:
    branches:
      - master

  workflow_dispatch:

jobs:

  # ============================================================
  # CONTINUOUS INTEGRATION
  # ============================================================

  ci:
    name: Continuous Integration
    runs-on: self-hosted

    steps:

      # --------------------------------------------------------
      # 1. Checkout source code
      # --------------------------------------------------------

      - name: Checkout Code
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # 2. Check Docker
      # --------------------------------------------------------

      - name: Check Docker
        run: |
          docker --version
          docker info


      # --------------------------------------------------------
      # 3. Install Backend Dependencies
      # --------------------------------------------------------

      - name: Install Backend Dependencies
        working-directory: backend
        run: |
          npm ci


      # --------------------------------------------------------
      # 4. Run Backend Lint
      # --------------------------------------------------------

      - name: Run Backend Lint
        working-directory: backend
        run: |
          npm run lint


      # --------------------------------------------------------
      # 5. Build Frontend Docker Image
      # --------------------------------------------------------

      - name: Build Frontend Docker Image
        run: |
          docker build `
            -t frontend:latest `
            ./frontend


      # --------------------------------------------------------
      # 6. Build Backend Docker Image
      # --------------------------------------------------------

      - name: Build Backend Docker Image
        run: |
          docker build `
            -t backend:latest `
            ./backend


      # --------------------------------------------------------
      # 7. Show Docker Images
      # --------------------------------------------------------

      - name: Verify Docker Images
        run: |
          docker images


  # ============================================================
  # CONTINUOUS DEPLOYMENT
  # ============================================================

  cd:
    name: Continuous Deployment
    runs-on: self-hosted

    needs: ci

    steps:

      # --------------------------------------------------------
      # 1. Checkout Code
      # --------------------------------------------------------

      - name: Checkout Code
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # 2. Stop Existing Backend Container
      # --------------------------------------------------------

      - name: Stop Existing Backend
        run: |
          docker stop backend 2>$null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Backend container is not running"
          }

          docker rm backend 2>$null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Backend container does not exist"
          }


      # --------------------------------------------------------
      # 3. Stop Existing Frontend Container
      # --------------------------------------------------------

      - name: Stop Existing Frontend
        run: |
          docker stop frontend 2>$null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Frontend container is not running"
          }

          docker rm frontend 2>$null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Frontend container does not exist"
          }


      # --------------------------------------------------------
      # 4. Start Backend Container
      # --------------------------------------------------------

      - name: Start Backend Container
        run: |
          docker run -d `
            --name backend `
            -p 5000:5000 `
            backend:latest


      # --------------------------------------------------------
      # 5. Start Frontend Container
      # --------------------------------------------------------

      - name: Start Frontend Container
        run: |
          docker run -d `
            --name frontend `
            -p 80:80 `
            frontend:latest


      # --------------------------------------------------------
      # 6. Check Running Containers
      # --------------------------------------------------------

      - name: Verify Containers
        run: |
          docker ps


      # --------------------------------------------------------
      # 7. Check Backend Logs
      # --------------------------------------------------------

      - name: Check Backend Logs
        run: |
          docker logs --tail 50 backend


      # --------------------------------------------------------
      # 8. Check Frontend Logs
      # --------------------------------------------------------

      - name: Check Frontend Logs
        run: |
          docker logs --tail 50 frontend